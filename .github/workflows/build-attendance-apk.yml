name: Build CFBS Student Attendance APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-attendance-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Attendance APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Attendance Repository
        uses: actions/checkout@v4

      - name: Verify Dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<html' index.html
          echo "Dashboard verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16.0'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
      
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Generate Android Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/cfbs/attendance

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'CFBS Student Attendance'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cfbs.attendance'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.cfbs.attendance'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="CFBS Student Attendance"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/cfbs/attendance/MainActivity.java <<'EOF'
          package com.cfbs.attendance;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd android

          gradle wrapper \
            --gradle-version 8.2 \
            --distribution-type bin

          chmod +x gradlew

      - name: Build Attendance APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK build successful."

      - name: Upload Attendance APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Student-Attendance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14