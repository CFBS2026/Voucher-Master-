
name: Build Voucher Master APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Validate Flutter Project
        run: |
          test -f pubspec.yaml
          grep -q '^name: voucher_master$' pubspec.yaml

      - name: Generate Android Project if Missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name voucher_master --platforms=android .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart Files
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voucher_master_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
