
name: Build Voucher Master Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: |
          flutter create --platforms=android --org com.cfbs.vouchermaster .

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Fix Android Lint
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Fix Bluetooth Printer SDK and Namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          plugins = list(cache.glob("blue_thermal_printer-*/android"))

          if not plugins:
              raise SystemExit("Bluetooth printer plugin not found")

          for plugin in plugins:
              gradle = plugin / "build.gradle"
              manifest = plugin / "src/main/AndroidManifest.xml"

              if not gradle.exists() or not manifest.exists():
                  raise SystemExit("Bluetooth plugin files missing")

              content = gradle.read_text()

              content = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 35',
                  content
              )
              content = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  content
              )
              content = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 35',
                  content
              )

              manifest_text = manifest.read_text()
              match = re.search(
                  r'<manifest\b[^>]*\bpackage=["\']([^"\']+)',
                  manifest_text
              )

              if not match:
                  raise SystemExit("Cannot detect Bluetooth namespace")

              namespace = match.group(1)

              if not re.search(r'(?m)^\s*namespace\s+', content):
                  content, count = re.subn(
                      r'(?m)^(\s*android\s*\{)',
                      lambda m: m.group(1) +
                      '\n    namespace "' + namespace + '"',
                      content,
                      count=1
                  )

                  if count == 0:
                      raise SystemExit("Android block not found")

              gradle.write_text(content)
              print("Bluetooth plugin configured:", namespace)
          PY

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          cd ..

          echo "===== SEARCH APK ====="
          find android -type f -name "*.apk" -print

          APK_PATH=$(find android -type f \
            -name "app-release.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          mkdir -p build/app/outputs/flutter-apk

          cp "$APK_PATH" \
            build/app/outputs/flutter-apk/app-release.apk

          echo "===== APK READY ====="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoucherMasterPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
