
name: Build Voucher Master Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.cfbs.vouchermaster .
      
      - name: Disable Crashing Android Lint Task
        run: |
          cat >> android/build.gradle <<'EOF'

          // Workaround for Android Lint JavaDocParser crash
          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get
        
      - name: Fix Bluetooth Printer Android SDK
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          files = list(cache.glob(
              "blue_thermal_printer-*/android/build.gradle"
          ))

          if not files:
              files = list(cache.glob(
                  "blue_thermal_printer-*/android/build.gradle.kts"
              ))

          if not files:
              raise SystemExit("Bluetooth printer Gradle file not found")

          for file in files:
              content = file.read_text()

              content = re.sub(
                  r'compileSdkVersion\s+\d+',
                  'compileSdkVersion 35',
                  content
              )

              content = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 35',
                  content
              )

              content = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 35',
                  content
              )

              file.write_text(content)
              print("Updated Bluetooth Plugin SDK:", file)
          PY


      - name: Fix Bluetooth Printer Namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          plugin = Path.home() / ".pub-cache/hosted/pub.dev/blue_thermal_printer-1.2.3/android"
          gradle = plugin / "build.gradle"
          manifest = plugin / "src/main/AndroidManifest.xml"

          if not gradle.exists() or not manifest.exists():
              raise SystemExit("Bluetooth printer plugin files not found")

          content = manifest.read_text()
          match = re.search(r'<manifest\b[^>]*\bpackage=["\']([^"\']+)', content)

          if not match:
              raise SystemExit("Cannot detect plugin package")

          namespace = match.group(1)
          build = gradle.read_text()

          if not re.search(r'(?m)^\s*namespace\s+', build):
              build, count = re.subn(
                  r'(?m)^(\s*android\s*\{)',
                  lambda m: m.group(1) + '\n    namespace "' + namespace + '"',
                  build,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Android block not found")

              gradle.write_text(build)

          print("Namespace configured:", namespace)
          PY

      
      - name: Build APK
        run: |
          flutter build apk --release --verbose
          echo "===== APK FILE CHECK ====="
          find build android -type f -name "*.apk" -print || true
          echo "===== BUILD OUTPUT ====="
          ls -lah build/app/outputs/flutter-apk/ || true


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoucherMasterPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
